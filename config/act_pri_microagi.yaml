_target_: workspace.act_pri_ws.ActPriWorkspace

hydra:
  run:
    dir: outputs/${cfg.general.project_name}/${cfg.general.task_name}/${now:%Y-%m-%d_%H-%M-%S}

cfg:
  general:
    # dataset specific
    project_name: "sarm2-microagi"

    task_name: "actpri_sample"
    repo_id: microagi_actpri_sample       # ~/.cache/huggingface/lerobot/<repo_id> (MicroAGI act_pri segments)

    state_norm_path: /home/yangcyself/workspace/vla_ws/sarm_datasets/microagi_actpri_sample/meta/state_norm.json
    camera_names: [observation.images.front]
    split_by: source          # episodes from one recording never straddle train/val (meta/episodes.jsonl source_uuid)
    video_backend: torchcodec  # torchcodec 0.8 (scripts/fix_torchcodec_ffmpeg.sh); pyav also works but is ~3x slower
    seed: 42
    device: "cuda"

  dataloader:
    batch_size: 64
    num_workers: 32   # S3 benchmark (act_pri, 224px, torchcodec): 16 -> 1.2, 24 -> 1.6, 32 -> 2.1 steps/s; ~0.4 GB RAM per worker
    prefetch_factor: 1
    shuffle: True
    pin_memory: True
    persistent_workers: False
    timeout: 600         # s; a torchcodec decode deadlocked one worker once (S3 sarm2 run, ~150k items in): fail fast instead of stalling forever

  val_dataloader:
    batch_size: 32
    num_workers: 4
    shuffle: False
    pin_memory: True
    persistent_workers: False

  encoders:
    vision_ckpt: "google/siglip2-base-patch16-224"  # SigLIP

  model:
    use_future_step: False
    d_model: 512          
    n_layers: 4
    n_heads: 8
    dropout: 0.1
    n_obs_steps: 6
    max_rewind_steps: 0
    frame_gap: 30
    frame_size: 224      # loader resizes decoded frames to 224x224 in the workers (SigLIP input size); null = native
    state_dim: 12
    max_pred_ratio: 0.95
    alpha_class_loss: 0.0
    pre_decode_video_frames: False
    no_state: False
    resume_training: False
    model_path: ""
    no_pertube: True

    ## MicroAGI primitives (meta/act_pri_list.json): 17 verbs >= 5 h + dummy
    num_tasks: 18
    task_list: [
                "place",
                "pick_grab",
                "fold_flatten",
                "tie",
                "insert",
                "apply",
                "close",
                "arrange",
                "wrap",
                "remove",
                "erase",
                "cut",
                "install",
                "sew",
                "open",
                "scoop",
                "pour_dump",
                "dummy"
                ]


    num_class: 8
    class_list: [
                "pick_grab or scoop",
                "place or pour_dump",
                "erase or apply or arrange",
                "install or insert or close",
                "fold_flatten or sew",
                "tie or wrap",
                "cut or remove or open",
                "dummy"
                ]
    
   

  optim:
    reward_lr: 5e-5
    action_lr: 2.5e-5
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8
    warmup_steps: 1000
    total_steps: 200      # smoke run

  train:
    num_epochs: 1        
    num_steps: 200       # smoke run; which one comes first
    grad_clip: 1.0
    log_every: 10        # steps
    eval_every: 1        # epochs
    save_every: 200      # steps
    val_portion: 0.1     # fraction of episodes for validation
    max_val_batches: 20  # smoke run: cap the end-of-epoch validation (null = full val set)

  eval:
    run_times: 120  # number of episodes to evaluate in video
    split_task: True
    raw_data_run_times: 1
    eval_frame_gap: 10

    ckpt_path: /PATH/TO/ACT_PRI_CHECKPOINT.PT  # trained act_pri checkpoint to evaluate

    eval_whole_task: False
    whole_task:
      repo_id: YOUR_HF_REPO_ID  # HuggingFace dataset repo id for whole-task eval
      task_inst_list: [
        "pick and place plates into bin",
        "clean whiteboard WITH whiteboard eraser",
        "folding shorts",
        "folding the t-shirt",
        "pick and place plates into dish rack",
        "sweep paper scraps WITH broom",
        "coil and wrap headphones",
        "pull plug off the socket",
        "put away an umbrella",
        "set dinner table"
      ]


    raw_data_dir: /PATH/TO/RAW_DATA_DIR  # directory of raw episode_* trajectories

    
    


            