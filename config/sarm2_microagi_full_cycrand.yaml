_target_: workspace.sarm2_ws.SARM2Workspace

hydra:
  run:
    dir: outputs/${cfg.general.project_name}/${cfg.general.task_name}/${now:%Y-%m-%d_%H-%M-%S}

cfg:
  general:
    # dataset specific
    project_name: "sarm2-microagi"

    task_name: "sarm2_full_cycrand"
    repo_id: microagi_sarm2_full      # ~/.cache/huggingface/lerobot/<repo_id> (MicroAGI task cycles, full deduplicated export, --min-nondummy-share 0.5)
    state_norm_path: /home/yangcyself/workspace/vla_ws/sarm_datasets/microagi_sarm2_full/meta/state_norm.json

    camera_names: [observation.images.front]
    split_by: cycle_holdout_random   # S6: one random middle cycle (neither first nor last) of every recording with >= 3 distinct cycles held out; duplicate exports (R26) dropped
    video_backend: torchcodec  # torchcodec 0.8 (scripts/fix_torchcodec_ffmpeg.sh); pyav also works but is ~3x slower
    seed: 42
    device: "cuda"

  dataloader:
    batch_size: 64
    num_workers: 24   # S7: extraction finished; sarm2 items carry up to 10 frames, 24 workers stay well under 60 GB anon
    prefetch_factor: 1
    shuffle: True
    pin_memory: True
    persistent_workers: False
    timeout: 600         # s; a torchcodec decode deadlocked one worker once (S3 sarm2 run, ~150k items in): fail fast instead of stalling forever

  val_dataloader:
    batch_size: 32
    num_workers: 4
    shuffle: False
    pin_memory: True
    persistent_workers: False

  encoders:
    vision_ckpt: "google/siglip2-base-patch16-224"  # SigLIP


  model:
    act_pri:
      n_layers: 4
      d_model: 512          
      n_heads: 8
      dropout: 0.1
      state_dim: 12
    use_future_step: True
    d_model: 512          
    n_layers: 6
    n_heads: 8
    dropout: 0.1
    n_obs_steps: 6
    max_rewind_steps: 3
    frame_gap: 30
    frame_size: 224      # loader resizes decoded frames to 224x224 in the workers (SigLIP input size); null = native
    state_dim: 12
    pre_decode_video_frames: False
    no_state: False
    resume_training: False
    model_path: ""
    act_pri_model_path: /home/yangcyself/workspace/vla_ws/opensarm/outputs/sarm2-microagi/actpri_full/2026-09-10_01-19-59/checkpoints/act_pri_final.pt  # act_pri_microagi_full run (16000 steps), filled in by run_s7.sh
    finetune_act_pri: False  # frozen act_pri from the full act_pri run (iteration-1 baseline recipe, as S5/S6)
    act_pri_loss_weight: 0.25  # weight for action prediction loss in the total loss (reward + action prediction)
    no_pertube: True
    moe:
      num_experts: 10
      top_k: 2
      gate_units: [256]
      gate_dropout: 0.1    
      gate_act: "gelu"    
      expert_units: [256, 256, 256]
      expert_dropout: 0.1 
      expert_act: "gelu"
      # hyperparam for auxiliary loss terms
      lambda_balance: 2.5   
      lambda_entropy: 0.5
      lambda_importance: 0.1
      # hyperparam for balancing regression and auxiliary losses
      alpha_auxiliary: 0.2

    ## MicroAGI primitives (meta/act_pri_list.json): 17 verbs >= 5 h + dummy
    num_tasks: 18
    task_list: [
      "place",
      "pick_grab",
      "fold_flatten",
      "tie",
      "insert",
      "apply",
      "close",
      "arrange",
      "wrap",
      "remove",
      "erase",
      "cut",
      "install",
      "sew",
      "open",
      "scoop",
      "pour_dump",
      "dummy"
      ]
    
    
    task_inst_list: null   # null -> the loader reads the whole-task instruction from meta/tasks.jsonl

    num_class: 8
    class_list: [
      "pick_grab or scoop",
      "place or pour_dump",
      "erase or apply or arrange",
      "install or insert or close",
      "fold_flatten or sew",
      "tie or wrap",
      "cut or remove or open",
      "dummy"
      ]
    
    
   

  optim:
    lr: 5e-5
    weight_decay: 5.0e-3
    betas: [0.9, 0.95]
    eps: 1.0e-8
    warmup_steps: 200
    total_steps: 20000

  train:
    num_epochs: 1 # 80k steps/1 epoch
    num_steps: 20000
    grad_clip: 1.0
    log_every: 20        # steps
    eval_every: 1        # epochs
    save_every: 2000     # steps
    val_portion: 0.1     # fraction of episodes for validation
    resume_from: null    # a reward_latest.pt / reward_step_*.pt to continue from (weights, optimizer, step, schedule)
    wandb_resume_id: null  # the wandb run id to continue when resuming
    max_val_batches: 200  # cap the end-of-training validation (null = full val set)

  eval:
    run_times: 100  # number of episodes to evaluate in video
    split_task: True
    raw_data_run_times: 36
    eval_whole_task_from_act_pri: False
    eval_frame_gap: 30

    ckpt_path_act_pri: /PATH/TO/ACT_PRI_CHECKPOINT.PT  # trained act_pri checkpoint to evaluate
    ckpt_path_reward: /PATH/TO/REWARD_CHECKPOINT.PT    # trained reward-model checkpoint to evaluate

    raw_data_dir: /PATH/TO/RAW_DATA_DIR  # directory of raw episode_* trajectories

    
